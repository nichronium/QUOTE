[project]
name = "quote-intelligence"
version = "0.1.0"
description = "Quote Intelligence and RFQ Comparison Layer for Procurement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pytest>=7.4.0",
    "openpyxl>=3.1.0",
    "pypdf>=3.15.0",
    "rapidfuzz>=3.0.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0"
]

[project.optional-dependencies]
document = [
    "docling>=2.0.0"
]
quality = [
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
